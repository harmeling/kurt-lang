name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false     # report each Python version on its own
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install kurt (editable, with dev extras)
        run: pip install -e .[dev]

      - name: Run test suite
        run: python -m unittest

      - name: Build and smoke-test the standalone bundle
        run: |
          python scripts/build_standalone.py
          python dist/kurt.py modus-ponens.kurt

  pyright:
    # the type check: 0 errors and 0 warnings, and no `# type: ignore` (pyproject.toml; the plan that got there: git history of dev/todo-pyright.md).
    # The version is pinned: a newer pyright can add checks, so it is raised on purpose, fixing what it finds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kurt (editable, with dev extras) and pyright
        run: pip install -e .[dev] pyright==1.1.407

      - name: Type check
        run: pyright
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"     # (the note that a newer pyright exists)

  ruff:
    # the checks for bugs, not for style (pyproject.toml: undefined and unused names, `== None`, a
    # raise in an `except` without its cause); pinned like pyright, raised on purpose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: pip install ruff==0.17.2 && ruff check

  macos:
    # macOS's Python has libedit instead of GNU readline: the shell must work there too (Tab,
    # the indentation typed instead of filled in -- tests/test_shell_indentation.py)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kurt (editable, with dev extras)
        run: pip install -e .[dev]

      - name: Run test suite
        run: python -m unittest

  lean:
    # `kurt --lean`, checked again by the Lean of scripts/lean-toolchain (the tests are
    # skipped without Lean elsewhere; here KURT_REQUIRE_LEAN makes a missing or older Lean fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat scripts/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Translate and check with Lean
        run: |
          pip install -e .
          lean --version
          KURT_REQUIRE_LEAN=1 python -m unittest -v tests.test_export_lean

  lean-mathlib:
    # `kurt --lean` of proofs about numbers (`import Mathlib`), checked by Lean with Mathlib in the
    # lake project scripts/lean (Mathlib's prebuilt files by `lake exe cache get`, cached by the
    # manifest); KURT_REQUIRE_MATHLIB makes a project that isn't set up fail instead of skip
    # (written 2026-10-16, not yet run on GitHub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat scripts/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: scripts/lean/.lake
          key: mathlib-${{ hashFiles('scripts/lean/lake-manifest.json', 'scripts/lean/lean-toolchain') }}

      - name: Set up Mathlib
        run: cd scripts/lean && lake exe cache get

      - name: Translate and check with Lean and Mathlib
        run: |
          pip install -e .
          KURT_REQUIRE_LEAN=1 KURT_REQUIRE_MATHLIB=1 python -m unittest -v tests.test_export_lean

  package:
    # what users get from `pip install`: build the sdist and the wheel, install each into a clean
    # environment, and check a proof outside the checkout (so nothing comes from `src/`)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python scripts/build_certificates.py       # (the certificates of the theories, shipped)
          pip install build
          python -m build

      - name: Install each into a clean environment and check a proof
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            echo "== $artifact"
            rm -rf /tmp/env /tmp/check
            python -m venv /tmp/env
            /tmp/env/bin/pip install "$artifact"
            mkdir /tmp/check
            cp modus-ponens.kurt /tmp/check/
            printf 'load natural, analysis, group\n0 ∈ Nat\n' > /tmp/check/theories.kurt
            (cd /tmp/check && /tmp/env/bin/kurt modus-ponens.kurt && /tmp/env/bin/python -m kurt theories.kurt)
            /tmp/env/bin/python -c "import kurt.kurt as k, pathlib; assert len(list(pathlib.Path(k.__file__).parent.glob('theories/*.kurtc'))) > 10, 'no certificates of the theories'"
          done
