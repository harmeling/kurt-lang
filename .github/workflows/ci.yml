name: CI

on:
  push:
  pull_request:

jobs:
  check-commit-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # If your script has a shebang and exec bit, you can skip chmod.
      - name: Ensure script is executable
        run: chmod +x scripts/check-commit-banner.py

      - name: Check banner matches commit
        run: scripts/check-commit-banner.py
