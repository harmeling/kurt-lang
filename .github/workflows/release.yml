name: Release

# when a version tag (`v0.7.0`, ...) is pushed: a GitHub release with the standalone `kurt.py`
# (job `standalone`), and the package on PyPI (job `pypi`) -- the latter only after PyPI knows this
# repository as a "trusted publisher" (pypi.org: the project `kurt-lang`, Publishing, add a
# GitHub publisher: owner `harmeling`, repository `kurt-lang`, workflow `release.yml`,
# environment `pypi`); no token is stored anywhere. By hand, for a tag that exists already:
# Actions, Release, Run workflow, with the tag (e.g. to put it on PyPI after the fact).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:           # by hand, for a tag that exists already (e.g. to publish it on PyPI later)
    inputs:
      tag:
        description: "the version tag, e.g. v0.7.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    # before anything is published: the tag is the version in kurt.py, the tests pass, and the
    # standalone kurt.py works -- both jobs below need it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag is the version in kurt.py
        run: |
          version=$(python -c "import ast,sys; t=ast.parse(open('src/kurt/kurt.py').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == 'version'))")
          test "v$version" = "$TAG" || { echo "tag $TAG, but kurt.py says $version"; exit 1; }

      - name: Run the tests
        run: |
          pip install -e .
          python -m unittest

      - name: Build and check the standalone kurt.py
        run: |
          python scripts/build_standalone.py
          mkdir /tmp/check
          printf 'load natural, analysis, group\n0 ∈ Nat\n' > /tmp/check/theories.kurt
          (cd /tmp/check && python $GITHUB_WORKSPACE/dist/kurt.py --no-kurtc theories.kurt)
          python dist/kurt.py --no-kurtc modus-ponens.kurt

  pypi:
    needs: verify
    # only when switched on (GitHub: Settings, Secrets and variables, Actions, Variables:
    # `PUBLISH_PYPI` = `true`) -- publishing on PyPI makes the package public
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # for trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1

  standalone:
    # the single-file `kurt.py` with all theories embedded, attached to a GitHub release of the
    # tag -- so `.../releases/latest/download/kurt.py` is a stable link to it (independent of
    # PyPI: this job runs also if the PyPI one fails)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the standalone kurt.py
        run: python scripts/build_standalone.py

      - name: Create the release with kurt.py (or update the file of an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/kurt.py --clobber
          else
            awk -v v="$version" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
            gh release create "$TAG" dist/kurt.py --title "Kurt $version" --notes-file notes.md
          fi
