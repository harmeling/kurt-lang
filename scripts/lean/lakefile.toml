# A lake project for checking `kurt --lean` exports with Mathlib (doc/kurt-doc.md, `--lean`).
# Not part of the package: Kurt itself, `pip install kurt-lang` and the playground never need
# Lean or Mathlib. Set up once (Mathlib's prebuilt oleans, about 5-6 GB, into .lake/, git-ignored):
#   cd scripts/lean && lake exe cache get
# then check an export:
#   python3 scripts/lean_check.py FILE.lean        (or: cd scripts/lean && lake env lean FILE.lean)
# The Mathlib tag matches the Lean of lean-toolchain (the same as scripts/lean-toolchain).
name = "kurt_lean"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"
