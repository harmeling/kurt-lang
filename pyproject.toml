[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kurt-lang"
dynamic = ["version"]     # from `version` in src/kurt/kurt.py
description = "Kurt: a small language for mathematical proofs close to how humans write them, checked automatically."
authors = [ { name = "Stefan Harmeling", email = "stefan.harmeling@cs.tu-dortmund.de" } ]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []    # runtime deps
keywords = ["proof", "proof checker", "logic", "mathematics", "education", "natural deduction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://www.kurt-lang.org"
Repository = "https://github.com/harmeling/kurt-lang"
Documentation = "https://github.com/harmeling/kurt-lang/blob/main/doc/kurt-doc.md"
Issues = "https://github.com/harmeling/kurt-lang/issues"

[project.optional-dependencies]
dev = ["coverage"]

[project.scripts]
kurt = "kurt.kurt:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "kurt.kurt.version"}

[tool.setuptools.package-data]
kurt = ["theories/*.kurt"]
