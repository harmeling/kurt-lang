[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kurt-lang"
dynamic = ["version"]     # from `version` in src/kurt/kurt.py
description = "Kurt: a programming language for mathematical proofs close to how humans write them, checked automatically."
authors = [ { name = "Stefan Harmeling", email = "stefan.harmeling@cs.tu-dortmund.de" } ]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []    # runtime deps
keywords = ["proof", "proof checker", "logic", "mathematics", "education", "natural deduction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://www.kurt-lang.org"
Repository = "https://github.com/harmeling/kurt-lang"
Documentation = "https://github.com/harmeling/kurt-lang/blob/main/doc/kurt-ref.md"
Issues = "https://github.com/harmeling/kurt-lang/issues"

[project.optional-dependencies]
dev = ["coverage"]

[project.scripts]
kurt = "kurt.kurt:main"

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["dist", "**/__pycache__"]       # dist/kurt.py is generated (scripts/build_standalone.py)
extraPaths = ["src", "scripts"]            # the tests import `grade_exercise` etc. from scripts/
pythonVersion = "3.10"
reportUnnecessaryTypeIgnoreComment = "error"      # a suppression that suppresses nothing (any more) is an error
enableTypeIgnoreComments = false                  # a bare `# type: ignore` does nothing: a suppression is `# pyright: ignore[rule]`, with its rule

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "kurt.kurt.version"}

[tool.setuptools.package-data]
kurt = ["theories/*.kurt", "theories/*.kurtc"]   # the certificates: scripts/build_certificates.py

[tool.ruff]
extend-exclude = ["scripts/lean", "trash", "dist"]

[tool.ruff.lint]
# the checks for bugs, not for style (the CI job `ruff`): undefined and unused names, a redefinition,
# `== None`, an exception raised in an `except` without its cause
select = ["F", "B904", "E711"]
